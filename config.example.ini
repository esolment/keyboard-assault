# keyboard-assault config
# Строки, начинающиеся с '#', и пустые строки игнорируются.

# Последовательность символов (a-z, 0-9), вводом которой на нужной
# клавиатуре вы привязываете ремаппер к этому устройству.
secret_sequence=1234

# Список идентификаторов устройств (vendor_id:product_id, hex, без 0x),
# для которых включается ПОЛНЫЙ набор функций:
#   Ctrl+F1 / Ctrl+F2 / Ctrl+F3, Alt+Space, RightShift, физический "/"
#
# Устройства не из этого списка получают только базовый remap:
#   Caps+I/J/K/L/U/O, Caps+Backspace, Shift+Backspace.
#
# Найти vendor:product:
#   Linux:   cat /proc/bus/input/devices | grep -B2 -A5 Vendor
#   Windows: keyboard_assault.exe --list   (программа выведет ID при подключении)
[full_layout_devices]
046d:c52b
1234:5678